{{define "dashboard"}}
{{template "head" .}}

<h1>runs &amp; rooms</h1>

<section class="card">
  <h2>start a run</h2>
  <form hx-post="/runs" hx-target="#submit-result" hx-swap="innerHTML">
    <label>pipeline file <input name="file" placeholder="pipelines/feature-delivery.yaml" required></label>
    <label>vars <input name="vars" placeholder="--var key=value …"></label>
    <button type="submit">run</button>
  </form>
  <div id="submit-result"></div>
</section>

<section class="card">
  <h2>open a room</h2>
  <form method="post" action="/rooms/host">
    <label>room file <input name="file" placeholder="rooms/leadership.yaml" required></label>
    <button type="submit">open</button>
  </form>
  <p class="muted">hosts the room on the daemon (or attaches to it if it's already live).</p>
</section>

<div id="runs" hx-get="/frag/runs" hx-trigger="every 3s" hx-swap="innerHTML">
  {{template "frag_runs" .}}
</div>

{{template "foot" .}}
{{end}}
