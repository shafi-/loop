# Development room
#
# The shipped dev team: @architect plans, @engineer builds, @reviewer
# checks. Tag who you need (@engineer add a retry to the client); the
# rest read along and speak when their seat has something to add.
# A maintained digest of the project rides everyone's context — /notes
# lists the area summaries.
#
# The flow this room is shaped for: @architect drafts a plan and
# writes it to .loop/plans/<name>.md (a summary + path lands in the chat),
# the room refines and approves it, then /run implement builds the
# newest plan in .loop/plans/ — no variables to remember.
#
# Tooling: the tools come from the persona library — architect and
# engineer carry the full working set, the reviewer is read-only on
# purpose. Override per agent here with tools:. Tool-granted personas
# may offer a DEEP DIVE when a question needs real verification — the
# offer's button (or: /deepdive @agent [topic]) runs it on the agent
# executor, with shell commands asking the room first.
#
# The personas come from the global library (~/.loop/personas/), so
# every project on this machine shares the same team; edit them there.
#
# Validate it:  loop validate .loop/rooms/dev.yaml
# Open it:      loop chat .loop/rooms/dev.yaml

name: dev

pipelines:
  - name: implement
    file: ../pipelines/implement.yaml

agents:
  - persona: architect   # tools from the library: read, write plans, run checks
  - persona: engineer    # read, write, run checks
  - persona: reviewer    # read-only, by design

settings:
  speak_threshold: 0.6
  max_spontaneous_replies: 2
  history_window: 50
