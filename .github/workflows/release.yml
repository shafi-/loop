# Release: a pushed v* tag cross-builds static binaries for every
# supported platform, publishes them as a GitHub release with checksums.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          # The -X path must match the module path; go.mod is its source
          # of truth — never hardcode it here.
          MODULE=$(go list -m)
          go build -trimpath \
            -ldflags "-s -w -X ${MODULE}/internal/cli.version=${GITHUB_REF_NAME}" \
            -o "dist/loop" ./cmd/loop

      - name: Package
        run: |
          tar -czf "loop_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" -C dist loop

      - uses: actions/upload-artifact@v4
        with:
          name: loop_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}
          path: loop_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          sha256sum loop_*.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            loop_*.tar.gz
            SHA256SUMS
          generate_release_notes: true
